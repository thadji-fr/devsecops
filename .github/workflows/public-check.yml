name: Public content check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse locale des contenus publics
        run: python3 scripts/check-public.py
      - name: Validation syntaxique des exemples YAML
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('examples').rglob('*.yaml')):
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print('OK:', path)
          PY
      - name: Cohérence des stacks Compose et des ports Nginx Stream
        run: python3 scripts/check-example-topology.py
      - name: Vérifier la résolution des quatre Compose sans les démarrer
        env:
          GUAC_DB_PASSWORD: ci
          GUAC_DB_ROOT_PASSWORD: ci
          ARCANE_ENCRYPTION_KEY: ci
        run: |
          docker compose version
          for file in examples/compose/*.compose.yaml; do
            docker compose --env-file examples/compose/.env.example -f "$file" config --quiet
            echo "OK : $file"
          done
      - name: Installer Nginx et le module Stream dans le runner isolé
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx libnginx-mod-stream openssl
      - name: Valider les fragments Nginx et les relais HTTP TCP UDP simulés
        run: python3 scripts/test-nginx-examples.py --smoke
