# Modèle anonymisé : manager sur WireGuard + socket Docker RW.
# Port d'administration non publié sur toutes les interfaces.
# Authentik (Forward Auth et policies) est défini dans Nginx/Authentik, PAS ici.
services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2
    container_name: arcane
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Europe/Paris}"
      APP_URL: "${ARCANE_PUBLIC_URL:-https://admin.example.org}"
      ENCRYPTION_KEY: "${ARCANE_ENCRYPTION_KEY:?required_for_test_only}"
      PROJECTS_DIRECTORY: "${ARCANE_PROJECTS_DIR:-/srv/example/compose-projects}"
    ports:
      - target: 3552
        published: "3552"
        host_ip: "${WG_BIND_IP:-127.0.0.1}"
        protocol: tcp
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: "${STACK_ROOT:-./example-data}/arcane/data"
        target: /app/data
      # Identity mapping : Arcane et Docker doivent résoudre les projets pareil.
      - type: bind
        source: "${ARCANE_PROJECTS_DIR:-/srv/example/compose-projects}"
        target: "${ARCANE_PROJECTS_DIR:-/srv/example/compose-projects}"
    # Aucune déclaration "privileged" : le socket reste toutefois puissant.
    networks:
      - edge

networks:
  edge:
    external: true
    name: example-edge
