# Nginx HTTP(S) -> backend sur un autre serveur via WireGuard.
# 192.0.2.10 est une IP de documentation RFC 5737, pas une vraie IP VPN.
# La route réseau effective et les règles d'accès restent à tester.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name remote-app.example.org;
    include /config/nginx/ssl.conf;

    location / {
        include /config/nginx/proxy.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_pass http://192.0.2.10:8080;
    }
}
