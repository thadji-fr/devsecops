# Exemple conceptuel HTTP pour un réseau Docker de test.
# À placer dans le bon contexte Nginx ; les proxys de prod exigent TLS et filtres.
server {
    listen 8080;
    server_name example.invalid;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://demo-app:8080;
    }
}
