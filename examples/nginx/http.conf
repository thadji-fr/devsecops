# Fragment HTTP : reverse proxy local sur le même réseau Docker que SWAG.
# À utiliser dans /config/nginx/proxy-confs/*.subdomain.conf, sous le contexte http.
# Adaptation de la structure SWAG. Le backend exact en production n'est pas publié.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitoring.example.org;

    include /config/nginx/ssl.conf;
    client_max_body_size 50m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app uptime-kuma;
        set $upstream_port 3001;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
