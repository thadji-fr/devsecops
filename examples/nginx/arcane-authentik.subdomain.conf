# Schéma Nginx / Authentik Forward Auth / Arcane.
# Ce fichier illustre la chaîne déclarée, SANS exporter providers ni policies.
# Nécessite les includes authentik-*.conf de l'installation Nginx correctement adaptés à l'outpost.
# La configuration des includes Nginx peut changer selon sa version.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.example.org;
    include /config/nginx/ssl.conf;

    # Définit les locations /outpost.goauthentik.io et auth_request.
    # L'upstream de l'outpost n'est PAS publié dans ce dépôt.
    include /config/nginx/authentik-server.conf;

    location / {
        # Autorisation contrôlée par les policies Authentik, pas par ce YAML.
        include /config/nginx/authentik-location.conf;
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app arcane;
        set $upstream_port 3552;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
