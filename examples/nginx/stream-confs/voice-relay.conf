# Nginx Stream TCP/UDP vers serveur vocal privé, valeurs TEST-NET-1.
# Le protocole UDP doit être déclaré explicitement au niveau Nginx ET Docker.
upstream voice_udp { server 192.0.2.10:9987; }
upstream voice_file_transfer { server 192.0.2.10:30033; }

server {
    listen 9987 udp;
    proxy_pass voice_udp;
    proxy_timeout 5m;
}
server {
    listen 30033;
    proxy_pass voice_file_transfer;
    proxy_connect_timeout 10s;
    proxy_timeout 30m;
}
