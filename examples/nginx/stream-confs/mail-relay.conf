# Équivalent anonymisé des relais Nginx Stream vers un serveur privé.
# 192.0.2.10 = TEST-NET-1, jamais une vraie destination WireGuard.
# Ne PAS ajouter de terminaison TLS ici : c'est du TCP passthrough.
# Les pare-feu / filtres SMTP et la destination réelle restent hors dépôt.
# Relevé en lecture seule : Nginx émet PROXY protocol (v1) sur le relais SMTP.
# L'écoute entrante n'attend pas PROXY protocol des clients Internet.
# La destination de documentation reste fictive (TEST-NET-1).
# Le backend doit avoir une écoute prévue pour lire l'en-tête PROXY
# (par exemple via HAProxy/Postfix) : ce point n'est PAS validé ici.
# Ne pas activer proxy_protocol sur les autres protocoles par analogie.
upstream mail_smtp      { server 192.0.2.10:25; }
upstream mail_smtps     { server 192.0.2.10:465; }
upstream mail_submission { server 192.0.2.10:587; }
upstream mail_imaps     { server 192.0.2.10:993; }
upstream mail_pop3s     { server 192.0.2.10:995; }
upstream mail_imap      { server 192.0.2.10:143; }
upstream mail_pop3      { server 192.0.2.10:110; }
upstream mail_sieve     { server 192.0.2.10:4190; }

server {
    listen 25;
    proxy_connect_timeout 10s;
    proxy_timeout 10m;
    proxy_protocol on;  # Émis uniquement VERS l'upstream; pas de "listen proxy_protocol".
    proxy_pass mail_smtp;
}
server { listen 465;  proxy_connect_timeout 10s; proxy_timeout 10m; proxy_pass mail_smtps; }
server { listen 587;  proxy_connect_timeout 10s; proxy_timeout 10m; proxy_pass mail_submission; }
server { listen 993;  proxy_connect_timeout 10s; proxy_timeout 10m; proxy_pass mail_imaps; }
server { listen 995;  proxy_connect_timeout 10s; proxy_timeout 10m; proxy_pass mail_pop3s; }
server { listen 143;  proxy_connect_timeout 10s; proxy_timeout 10m; proxy_pass mail_imap; }
server { listen 110;  proxy_connect_timeout 10s; proxy_timeout 10m; proxy_pass mail_pop3; }
server { listen 4190; proxy_connect_timeout 10s; proxy_timeout 10m; proxy_pass mail_sieve; }
